<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Semantic search pipeline for NASA mission documents</title>
  <desc id="desc">2,000+ project documents flow through an ETL pipeline and fine-tuned BERT models into an Elasticsearch index, which powers a search and question answering dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b7a9b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="800" height="450" fill="#fbfaf7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" transform="translate(0,11)">

    <!-- 1. Documents -->
    <g stroke="#1d3b53" stroke-width="3" stroke-linejoin="round">
      <rect x="76" y="118" width="72" height="92" rx="6" fill="#f3eee4"/>
      <rect x="68" y="128" width="72" height="92" rx="6" fill="#f3eee4"/>
      <rect x="60" y="138" width="72" height="92" rx="6" fill="#ffffff"/>
    </g>
    <g stroke="#2b7a9b" stroke-width="4" stroke-linecap="round">
      <line x1="74" y1="160" x2="118" y2="160"/>
      <line x1="74" y1="175" x2="112" y2="175"/>
      <line x1="74" y1="190" x2="118" y2="190"/>
      <line x1="74" y1="205" x2="100" y2="205"/>
    </g>

    <!-- 2. Fine-tuned BERT -->
    <rect x="240" y="120" width="120" height="110" rx="14" fill="#1d3b53"/>
    <g stroke="#9fd3e8" stroke-width="1.6" stroke-opacity="0.7">
      <!-- layer 1 -> 2 -->
      <line x1="268" y1="148" x2="300" y2="148"/><line x1="268" y1="148" x2="300" y2="175"/><line x1="268" y1="148" x2="300" y2="202"/>
      <line x1="268" y1="175" x2="300" y2="148"/><line x1="268" y1="175" x2="300" y2="175"/><line x1="268" y1="175" x2="300" y2="202"/>
      <line x1="268" y1="202" x2="300" y2="148"/><line x1="268" y1="202" x2="300" y2="175"/><line x1="268" y1="202" x2="300" y2="202"/>
      <!-- layer 2 -> 3 -->
      <line x1="300" y1="148" x2="332" y2="161"/><line x1="300" y1="148" x2="332" y2="189"/>
      <line x1="300" y1="175" x2="332" y2="161"/><line x1="300" y1="175" x2="332" y2="189"/>
      <line x1="300" y1="202" x2="332" y2="161"/><line x1="300" y1="202" x2="332" y2="189"/>
    </g>
    <g fill="#ffffff">
      <circle cx="268" cy="148" r="7"/><circle cx="268" cy="175" r="7"/><circle cx="268" cy="202" r="7"/>
      <circle cx="300" cy="148" r="7"/><circle cx="300" cy="175" r="7"/><circle cx="300" cy="202" r="7"/>
      <circle cx="332" cy="161" r="7" fill="#8fc28c"/><circle cx="332" cy="189" r="7" fill="#8fc28c"/>
    </g>

    <!-- 3. Elasticsearch index -->
    <path d="M450,140 v76 a50,14 0 0 0 100,0 v-76 z" fill="#2b7a9b"/>
    <ellipse cx="500" cy="140" rx="50" ry="14" fill="#5aa3c2"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2.5">
      <path d="M450,166 a50,14 0 0 0 100,0"/>
      <path d="M450,192 a50,14 0 0 0 100,0"/>
    </g>

    <!-- 4. Search & QA dashboard -->
    <rect x="640" y="120" width="120" height="110" rx="10" fill="#ffffff" stroke="#1d3b53" stroke-width="3"/>
    <path d="M641.5,140 v-8.5 a10,10 0 0 1 10,-10 h97 a10,10 0 0 1 10,10 v8.5 z" fill="#1d3b53"/>
    <g fill="#9fd3e8"><circle cx="652" cy="131" r="3"/><circle cx="662" cy="131" r="3"/><circle cx="672" cy="131" r="3"/></g>
    <rect x="652" y="150" width="96" height="18" rx="9" fill="#f3eee4" stroke="#2b7a9b" stroke-width="2"/>
    <circle cx="663" cy="158.5" r="4" fill="none" stroke="#2b7a9b" stroke-width="2"/>
    <line x1="666" y1="161.5" x2="669.5" y2="165" stroke="#2b7a9b" stroke-width="2" stroke-linecap="round"/>
    <rect x="652" y="178" width="64" height="9" rx="4.5" fill="#5b8c5a"/>
    <rect x="652" y="194" width="92" height="7" rx="3.5" fill="#d9d3c6"/>
    <rect x="652" y="207" width="76" height="7" rx="3.5" fill="#d9d3c6"/>

    <!-- arrows -->
    <g stroke="#2b7a9b" stroke-width="3.5" fill="none" marker-end="url(#arrow)">
      <line x1="160" y1="175" x2="228" y2="175"/>
      <line x1="370" y1="175" x2="438" y2="175"/>
      <line x1="562" y1="175" x2="628" y2="175"/>
    </g>

    <!-- labels -->
    <g font-size="20" font-weight="700" fill="#1d3b53">
      <text x="100" y="282">Mission docs</text>
      <text x="300" y="282">Fine-tuned BERT</text>
      <text x="500" y="282">Elasticsearch</text>
      <text x="700" y="282">Search &amp; QA</text>
    </g>
    <g font-size="15" fill="#5d6b76">
      <text x="100" y="306">2,000+ project files</text>
      <text x="300" y="306">NASA phrases &amp; acronyms</text>
      <text x="500" y="306">ETL + search index</text>
      <text x="700" y="306">Review dashboard</text>
    </g>

  </g>
</svg>
